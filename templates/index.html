<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head=~{::head}, content=~{::content})}">
<th:block th:fragment="head">
  <th:block th:replace="~{modules/seo :: head(title=${site.title + (!#strings.isEmpty(site.subtitle) ? ' | ' + site.subtitle : '') + (posts.page > 1 ? ' - 第 ' + posts.page + ' 页' : '')}, path=${posts.page > 1 ? '/page/' + posts.page : '/'}, description=${site.seo.description}, image=${theme.config.hero.image ?: site.logo}, type='website')}"></th:block>
</th:block>
<th:block th:fragment="content">

  <!-- ===================== HERO ===================== -->
  <section class="hero" th:if="${theme.config.hero.enable == null or theme.config.hero.enable}">
    <p class="eyebrow" th:if="${theme.config.hero.eyebrow != null and theme.config.hero.eyebrow != ''}"
       th:text="${theme.config.hero.eyebrow}">眉题</p>
    <h1 class="headline" th:text="${theme.config.hero.title}">主标题</h1>
    <p class="sub" th:if="${theme.config.hero.subtitle != null and theme.config.hero.subtitle != ''}"
       th:text="${theme.config.hero.subtitle}">副标题</p>
    <div class="cta-row">
      <a class="cta-primary"
         th:if="${theme.config.hero.cta_text != null and theme.config.hero.cta_text != ''}"
         th:href="${theme.config.hero.cta_anchor != null and theme.config.hero.cta_anchor != ''} ? ${theme.config.hero.cta_anchor} : '#posts'"
         th:text="${theme.config.hero.cta_text}">看看我的文章</a>
      <a class="secondary-link" th:href="@{/archives}">浏览全部文章 ↓</a>
    </div>

    <!-- 数据徽章行（1.1.0 新增） -->
    <div class="hero-stats reveal"
         th:if="${theme.config.hero.show_stats == null or theme.config.hero.show_stats}"
         th:with="postTotal = ${posts.total}">
      <div class="stat">
        <span class="stat-num" th:text="${postTotal}">48</span>
        <span class="stat-label">文章</span>
      </div>
      <span class="stat-sep" aria-hidden="true"></span>
      <div class="stat">
        <span class="stat-num" th:text="${categoryFinder.list(1, 1).total}">6</span>
        <span class="stat-label">分类</span>
      </div>
      <span class="stat-sep" aria-hidden="true"></span>
      <div class="stat">
        <span class="stat-num" th:text="${tagFinder.list(1, 1).total}">23</span>
        <span class="stat-label">标签</span>
      </div>
      <th:block th:if="${theme.config.hero.stat_visits != null and theme.config.hero.stat_visits != ''}">
        <span class="stat-sep" aria-hidden="true"></span>
        <div class="stat">
          <span class="stat-num" th:text="${theme.config.hero.stat_visits}">12.5k</span>
          <span class="stat-label">访问</span>
        </div>
      </th:block>
    </div>

    <p class="scroll-hint">向下，进入我的世界</p>
    <img class="hero-img" width="1400" height="400"
         th:if="${theme.config.hero.image != null and theme.config.hero.image != ''}"
         th:src="${theme.config.hero.image}" alt="横幅意象图" decoding="async">
  </section>

  <!-- ===================== 精选专题（1.1.0 新增） ===================== -->
  <th:block th:with="featuredEnabled = ${theme.config.featured?.enable == null or theme.config.featured?.enable},
                     featuredSeed = ${posts.page == 1 ? posts.items.?[spec.cover != null and spec.cover != ''] : {}},
                     featuredScanSize = ${50}">
    <th:block th:if="${featuredEnabled and posts.total > 0}">
      <!-- 首页当前页已有足够封面文章时不再查询；否则从第一页开始分批补取。 -->
      <th:block th:if="${#lists.size(featuredSeed) >= 3}">
        <th:block th:replace="~{modules/featured-posts :: section(${featuredSeed})}"></th:block>
      </th:block>
      <th:block th:if="${#lists.size(featuredSeed) < 3}">
        <th:block th:replace="~{modules/featured-posts :: scan(page=${1}, collected=${null}, scanSize=${featuredScanSize})}"></th:block>
      </th:block>
    </th:block>
  </th:block>

  <!-- ===================== POSTS ===================== -->
  <section class="section" id="posts" th:styleappend="${theme.config.hero.enable} ? 'padding-top:20px;' : ''"
           th:with="postLayout = ${theme.config.posts?.layout} ?: 'grid'">
    <div class="container">
      <div class="section-head reveal">
        <p class="eyebrow">WRITING · 技术随笔</p>
        <h2 class="title">写下来，才算想明白</h2>
      </div>

      <th:block th:if="${#lists.isEmpty(posts.items)}">
        <div class="empty-tip">还没有发布文章，去 Halo 后台写第一篇吧。</div>
      </th:block>

      <!-- 经典纵向列表布局 -->
      <div class="post-list" th:if="${postLayout == 'list'}">
        <th:block th:each="post, iterStat : ${posts.items}">
          <!-- 置顶文章：大卡片，封面独立可选（th:replace 优先级高于 th:if，守卫必须放外层 block） -->
          <th:block th:if="${post.spec.pinned}">
            <th:block th:replace="~{modules/post-featured :: post-featured}"></th:block>
          </th:block>
          <!-- 普通列表项 -->
          <th:block th:unless="${post.spec.pinned}">
            <th:block th:replace="~{modules/post-item :: post-item}"></th:block>
          </th:block>
        </th:block>
      </div>

      <!-- 双列网格布局（1.1.0 新增，默认） -->
      <div class="post-grid" th:if="${postLayout == 'grid'}">
        <th:block th:each="post, iterStat : ${posts.items}">
          <!-- 置顶文章：通栏大卡片，封面独立可选（th:replace 优先级高于 th:if，守卫必须放外层 block） -->
          <th:block th:if="${post.spec.pinned}">
            <th:block th:replace="~{modules/post-featured :: post-featured}"></th:block>
          </th:block>
          <!-- 普通文章：网格卡 -->
          <article class="post-card reveal"
                   th:unless="${post.spec.pinned}">
            <div class="post-meta">
              <a class="cat-pill" th:each="category : ${post.categories}"
                 th:href="@{${category.status.permalink}}"
                 th:text="${category.spec.displayName}">分类</a>
              <a class="tag-pill" th:each="tag : ${post.tags}"
                 th:href="@{${tag.status.permalink}}"
                 th:text="'# ' + ${tag.spec.displayName}"># 标签</a>
              <th:block th:replace="~{modules/visit-badge :: visit-badge(post=${post})}"></th:block>
            </div>
            <a th:href="@{${post.status.permalink}}">
              <h3 class="post-title" th:text="${post.spec.title}">文章标题</h3>
            </a>
            <p class="post-excerpt" th:if="${post.status.excerpt != null and post.status.excerpt != ''}"
               th:text="${post.status.excerpt}">摘要</p>
            <span class="post-date" th:if="${post.spec.publishTime != null}"
                  th:text="${#dates.format(new java.util.Date(post.spec.publishTime.toEpochMilli()), 'MMM d, yyyy')}">Jan 1, 2026</span>
          </article>
        </th:block>
      </div>

      <th:block th:replace="~{modules/pagination :: pagination}"></th:block>

      <div class="section-foot" th:if="${posts.hasNext}">
        <a class="more-link" th:href="@{/archives}">查看全部文章</a>
      </div>
    </div>
  </section>

  <!-- ===================== 作者卡片（1.1.0 新增） ===================== -->
  <section class="section author-section"
           th:if="${theme.config.author?.enable == null or theme.config.author?.enable}">
    <div class="container">
      <div class="author-card reveal">
        <div class="avatar-badge">
          <img class="photo" width="160" height="160"
               th:if="${theme.config.basic?.avatar != null and theme.config.basic?.avatar != ''}"
               th:src="${theme.config.basic.avatar}" alt="作者头像" loading="lazy" decoding="async">
          <span class="badge svg-icon icon-leaf"
                th:unless="${theme.config.basic?.avatar != null and theme.config.basic?.avatar != ''}"
                aria-hidden="true"></span>
        </div>
        <div class="info">
          <p class="eyebrow" th:text="${theme.config.author?.eyebrow} ?: 'ABOUT ME · 关于我'">ABOUT ME · 关于我</p>
          <span class="nm" th:text="${theme.config.author?.name != null and theme.config.author?.name != ''} ? ${theme.config.author.name} : ${site.title}">Ron567</span>
          <p class="bio" th:if="${theme.config.author?.bio != null and theme.config.author?.bio != ''}"
             th:text="${theme.config.author.bio}">简介文案</p>
          <div class="contact-row">
            <a class="contact-pill"
               th:if="${theme.config.footer.email != null and theme.config.footer.email != ''}"
               th:href="'mailto:' + ${theme.config.footer.email}">邮箱</a>
            <a class="contact-pill" target="_blank" rel="noopener"
               th:if="${theme.config.footer.github != null and theme.config.footer.github != ''}"
               th:href="${theme.config.footer.github}">GitHub</a>
            <a class="contact-pill" th:href="@{/archives}">文章归档</a>
          </div>
        </div>
      </div>
    </div>
  </section>

</th:block>
</html>
