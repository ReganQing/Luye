<!-- 分页组件：依赖变量 posts（UrlContextListResult，含 prevUrl/nextUrl） -->
<!-- 禁用态渲染为 span（不可聚焦、不进 Tab 序），避免 javascript: 链接被读屏当作可用链接 -->
<div class="pagination" xmlns:th="https://www.thymeleaf.org" th:fragment="pagination"
     th:if="${posts.totalPages > 1}">
  <a class="page-btn" th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}" rel="prev">← 上一页</a>
  <span class="page-btn disabled" th:unless="${posts.hasPrevious()}" aria-disabled="true">← 上一页</span>
  <span class="page-info" th:text="${posts.page} +' / '+ ${posts.totalPages}">1 / 1</span>
  <a class="page-btn" th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}" rel="next">下一页 →</a>
  <span class="page-btn disabled" th:unless="${posts.hasNext()}" aria-disabled="true">下一页 →</span>
</div>
