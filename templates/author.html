<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head=null, content=~{::content})}">
<th:block th:fragment="content">
  <div class="container">
    <header class="about-hero" style="padding-top:80px;">
      <p class="eyebrow">AUTHOR · 作者</p>
      <h1 class="title" th:text="${author.displayName}">作者名</h1>
      <div class="portrait">
        <img class="photo" th:if="${author.avatar != null and author.avatar != ''}"
             th:src="${author.avatar}" alt="头像">
        <th:block th:unless="${author.avatar != null and author.avatar != ''}">
          <img class="badge" th:src="@{/assets/svg/mountain.svg}" alt="">
          <span class="cap" th:text="${author.displayName}">作者名</span>
        </th:block>
      </div>
      <p class="post-meta-bar" th:if="${author.bio != null and author.bio != ''}">
        <span th:text="${author.bio}">作者简介</span>
      </p>
    </header>

    <div class="section" style="padding-top:40px;">
      <th:block th:if="${#lists.isEmpty(posts.items)}">
        <div class="empty-tip">该作者暂无文章。</div>
      </th:block>
      <div class="post-list">
        <th:block th:each="post : ${posts.items}">
          <th:block th:replace="~{modules/post-item :: post-item}"></th:block>
        </th:block>
      </div>
      <th:block th:replace="~{modules/pagination :: pagination}"></th:block>
    </div>
  </div>
</th:block>
</html>
